<!--
  Password prompt for pages encrypted by scripts/encrypt-site.mjs (StatiCrypt).
  Adapted from staticrypt@3.5.4 lib/password_template.html: the /*[|...|]*/0
  placeholders and the decrypt logic are StatiCrypt's; the look is the site's
  (former maintenance page). Self-contained: only /bg.jpg and the favicon are
  fetched, both of which are public files.
-->

    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Decryption needs crypto.subtle, which browsers only expose on https
      // (and localhost). Over plain http the form throws "reading 'importKey'",
      // so move to https before showing it.
      if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
        location.replace("https://" + location.host + location.pathname + location.search + location.hash);
      }
    </script>
    <title>ADGitter</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #0a0912;
        --bg-alt: #14111e;
        --card-bg: rgba(21, 18, 31, 0.74);
        --text: #eef0f8;
        --text-muted: #a39dbd;
        --border: rgba(158, 141, 199, 0.24);
        --accent: #5ec8ff;
        --accent-dark: #3fa8e0;
        --accent-ink: #071019;
      }
      * {
        box-sizing: border-box;
      }
      .hidden {
        display: none !important;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem 1rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial,
          "PingFang TC", "Microsoft JhengHei", sans-serif;
        line-height: 1.6;
        color: var(--text);
        background-color: var(--bg);
        background-image:
          linear-gradient(180deg, rgba(6, 5, 12, 0.6), rgba(6, 5, 12, 0.82)),
          url("/bg.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        padding: 2rem;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      .sub {
        margin: 0 0 0.75rem;
        color: var(--text-muted);
        font-size: 1rem;
        font-weight: 400;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--text-muted);
      }
      label {
        display: block;
        margin-bottom: 0.4rem;
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .row {
        display: flex;
        gap: 0.5rem;
      }
      .pw {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .pw input {
        width: 100%;
        padding: 0.6rem 2.4rem 0.6rem 0.8rem;
        font: inherit;
        color: var(--text);
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .pw img {
        position: absolute;
        top: 50%;
        right: 0.7rem;
        width: 1.1rem;
        transform: translateY(-50%);
        cursor: pointer;
        filter: invert(0.75);
      }
      button {
        padding: 0.6rem 1.2rem;
        font: inherit;
        font-weight: 600;
        color: var(--accent-ink);
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-dark);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .remember {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0.75rem 0 0;
        font-size: 0.85rem;
      }
      .error {
        margin: 0.75rem 0 0;
        color: #ff8a8a;
      }
      /* Pricing + legal pages are never encrypted (Polar's merchant review
         reads them), so link them from here. */
      .legal {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        margin: 1.5rem 0 0;
        padding: 1rem 0 0;
        border-top: 1px solid var(--border);
        list-style: none;
        font-size: 0.82rem;
      }
      .legal a {
        color: var(--text-muted);
        text-decoration: underline;
      }
      .legal a:hover {
        color: var(--accent);
      }
      .spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
